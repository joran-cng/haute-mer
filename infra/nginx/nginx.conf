worker_processes auto;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 20000;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Résolveur Docker : une instance redémarrée peut changer d'adresse IP.
  resolver 127.0.0.11 valid=2s ipv6=off;

  # least_conn : les connexions durent longtemps, le tourniquet les déséquilibrerait
  # après chaque redémarrage. Aucune session collante : l'état vit dans Redis.
  upstream game {
    zone game 64k;
    least_conn;
    server game-1:3000 resolve max_fails=1 fail_timeout=3s;
    server game-2:3000 resolve max_fails=1 fail_timeout=3s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=auth:10m rate=100r/s;

  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /assets/ {
      expires 7d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
      limit_req zone=auth burst=400 nodelay;
      limit_req_status 429;
      proxy_pass http://game;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location = /ws {
      proxy_pass http://game;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_next_upstream error timeout;
    }

    # /metrics et les sondes internes ne sont volontairement pas exposés.
  }
}
